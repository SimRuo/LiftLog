name: Deploy to Server

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Deploy to server
      uses: appleboy/ssh-action@v1.0.0
      with:
        host: ${{ secrets.SERVER_HOST }}
        username: ${{ secrets.SERVER_USER }}
        key: ${{ secrets.SERVER_SSH_KEY }}
        port: 2233
        script: |
          cd ~/LiftLog
          git reset --hard HEAD
          git pull origin main
          export MSSQL_SA_PASSWORD='${{ secrets.MSSQL_SA_PASSWORD }}'
          export JWT_KEY='${{ secrets.JWT_KEY }}'
          docker compose down
          docker compose up -d --build
          # Idempotent: a no-op once the model is in the ollama-models volume,
          # which survives `compose down`. Only the first deploy pays the ~2.5GB
          # download. Keep this tag in step with Ollama__Model in the compose file.
          docker compose exec -T ollama ollama pull qwen3:4b-instruct
          sleep 5
          docker compose logs backend --tail=400
