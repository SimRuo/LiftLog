server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Plan generation runs a model on the CPU and sends nothing back until it
    # finishes, which is a minute or two. nginx's default proxy_read_timeout is
    # 60s — it measures the gap between reads from upstream, so a long silent
    # generation trips it and the caller gets a 504 while the backend is still
    # happily working.
    #
    # Deliberately its own location rather than raising the timeout for all of
    # /api/: every other endpoint answers in milliseconds, and giving them ten
    # minutes to do it would turn a genuinely hung request into a ten-minute
    # hang instead of a fast, obvious failure.
    location /api/ai/ {
        proxy_pass http://backend:5000;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
        proxy_pass http://backend:5000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
