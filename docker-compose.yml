services:
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD}
      # SQL Server's default max memory is effectively unbounded, and it does
      # not give pages back eagerly. Capping it means the kernel never has to
      # choose between the database and the 2.5GB the model wants while it's
      # generating — a choice the OOM killer would otherwise make for us.
      MSSQL_MEMORY_LIMIT_MB: "8192"
    ports:
      - "1433:1433"
    volumes:
      - mssql-data:/var/opt/mssql
    networks:
      - liftlog-network
    healthcheck:
      test: /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "${MSSQL_SA_PASSWORD}" -C -Q "SELECT 1" || exit 1
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # Plan generation, self-hosted. CPU-only inference on a 4-core Kaby Lake:
  # roughly 10 tokens/sec on a 4B model at Q4, so a six-day plan lands in about
  # 90 seconds. Nothing here needs a GPU.
  #
  # Pull the model once after first start:
  #   docker compose exec ollama ollama pull qwen3:4b-instruct
  #
  # OLLAMA_MAX_LOADED_MODELS caps resident models at one, and the app asks for a
  # short keep_alive, so the ~2.5GB is only held while the feature is in use.
  ollama:
    image: ollama/ollama:latest
    environment:
      OLLAMA_MAX_LOADED_MODELS: "1"
      # 4 cores, and SQL Server wants some of them. Leaving one free keeps the
      # rest of the box responsive while a plan generates.
      OLLAMA_NUM_PARALLEL: "1"
      OLLAMA_NUM_THREAD: "3"
    volumes:
      - ollama-models:/root/.ollama
    networks:
      - liftlog-network
    restart: unless-stopped

  backend:
    build:
      context: ./server
      dockerfile: Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: "http://+:5000"
      ConnectionStrings__DefaultConnection: "Server=db,1433;Database=LiftLog;User Id=sa;Password=${MSSQL_SA_PASSWORD};TrustServerCertificate=True"
      Jwt__Key: ${JWT_KEY}
      Jwt__Issuer: "LiftLog"
      Jwt__Audience: "LiftLog"
      Ai__Provider: "ollama"
      Ollama__BaseUrl: "http://ollama:11434"
      Ollama__Model: "qwen3:4b-instruct"
    ports:
      - "5000:5000"
    depends_on:
      db:
        condition: service_healthy
      ollama:
        condition: service_started
    networks:
      - liftlog-network

  frontend:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: liftlog-frontend
    depends_on:
      - backend
    networks:
      - liftlog-network
      - web-proxy
    restart: unless-stopped

volumes:
  mssql-data:
  ollama-models:

networks:
  liftlog-network:
    driver: bridge
  web-proxy:
    external: true
